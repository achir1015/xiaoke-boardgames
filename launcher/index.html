<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>小柯機器人棋類大全</title>

  <main id="app" class="wrap">
    <header class="top">
      <img class="logo" src="img/icon.png" alt="">
      <div class="titles">

    <section id="cards" class="cards"></section>

    <footer class="foot">系統開發：吳玉柱 先生 與 Claude AI Opus 5.5</footer>
